name: OpenLink
options:
  bundleIdPrefix: org.openlink
  deploymentTarget:
    iOS: "15.1"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

# No packages. The app has zero third-party dependencies: the old
# socket.io-client-swift dependency was removed along with the server —
# the child device speaks a plain WebSocket, which URLSessionWebSocketTask
# handles natively.

targets:
  OpenLink:
    type: application
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: OpenLink/Sources
    resources:
      - path: OpenLink/Assets.xcassets
    # No entitlements file: the only entitlement this app used to need was
    # aps-environment for APNs, and there is categorically no APNs path
    # without a provider server (see docs/PROTOCOL.md, "Deliberate
    # limitations"). Notifications are local-only.
    info:
      path: OpenLink/Info.plist
      properties:
        CFBundleDisplayName: OpenLink
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Pairing is a camera QR scan (Pairing/QRScannerView.swift). This is
        # the only use of the camera.
        NSCameraUsageDescription: "OpenLink uses the camera to scan the pairing QR code shown on your child's device."
        # NWBrowser for _openlink._tcp (Networking/BonjourBrowser.swift) needs
        # both the usage string and an explicit service declaration on iOS 14+.
        NSLocalNetworkUsageDescription: "OpenLink finds your child's device on your Wi-Fi so it can connect directly, without any server in between."
        NSBonjourServices:
          - _openlink._tcp
        # The child device serves a self-signed certificate on a raw LAN or
        # overlay-network IP address, so ATS can never validate it and
        # exceptions can't be scoped to a domain. Security here comes from
        # certificate pinning in Networking/CertificatePinning.swift, which
        # pins the exact certificate learned out-of-band from the pairing QR
        # — a strictly stronger check than the system trust evaluation this
        # disables. NSAllowsLocalNetworking is declared too so the intent is
        # visible even though arbitrary loads already covers it.
        # NSAllowsLocalNetworking is deliberately NOT set alongside this. Apple
        # documents that when NSAllowsArbitraryLoads is combined with
        # NSAllowsLocalNetworking (or the WebContent/Media keys), the broad key
        # is IGNORED on iOS 10+ and only the narrower one applies -- which
        # would have covered the home-Wi-Fi case while silently excluding
        # overlay addresses like Tailscale's 100.64/10, the whole
        # away-from-home path. One key, unambiguous.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlink.parent
        PRODUCT_NAME: OpenLink
        SWIFT_VERSION: "5.0"
        # Without this the asset catalog is compiled but nothing points at the
        # icon set, and the app installs with a blank home-screen icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true

  # Logic tests. Deliberately compiles the few files under test straight into
  # the bundle rather than hosting the app: the pairing payload is pure string
  # handling, and a test that needs the app installed and launched is a test
  # nobody runs locally.
  OpenLinkTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.1"
    sources:
      - path: OpenLinkTests
      - path: OpenLink/Sources/Pairing/PairingURI.swift
      - path: OpenLink/Sources/Model/DeviceEndpoint.swift
      - path: OpenLink/Sources/Model/ProtocolModels.swift
      - path: OpenLink/Sources/Networking/CryptoUtil.swift
      - path: OpenLink/Sources/Networking/LocalNetworkAccess.swift
      - path: OpenLink/Sources/Networking/EndpointFailure.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlink.parent.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  OpenLink:
    build:
      targets:
        OpenLink: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
      targets:
        - OpenLinkTests
