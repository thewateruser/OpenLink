# Builds both apps and attaches them to a GitHub Release.
#
# Trigger by pushing a tag (`git tag v0.1.0 && git push origin v0.1.0`), or
# run manually from the Actions tab for an untagged prerelease build.
#
# On signing, which is the whole reason these two artifacts differ:
#
#   Android — the APK is signed with the debug keystore Gradle generates
#   automatically, so it installs on any device with "unknown sources"
#   allowed. See the release notes below for why that is not the same as a
#   properly signed release build.
#
#   iOS — the IPA is UNSIGNED. Producing an installable one requires an Apple
#   Developer account and a provisioning profile, which CI does not have.
#   Unsigned is the normal format for sideloading via AltStore / Sideloadly /
#   TrollStore, which re-sign with the installing user's own Apple ID.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to release, e.g. v0.1.0. Leave blank for a dev prerelease."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # `gh release create` creates the tag server-side from --target, so a
      # dispatched run can cut a real version without anyone pushing a tag.
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            echo "name=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licences
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Name the artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/OpenLink-child-${{ needs.version.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  ios:
    name: iOS IPA (unsigned)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # `build` rather than `archive`: archiving insists on a signing identity
      # even with signing disabled, whereas a plain device build with signing
      # off produces exactly the unsigned arm64 .app an IPA wraps.
      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild build \
            -project OpenLink.xcodeproj \
            -scheme OpenLink \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      # An IPA is just a zip with the .app inside a top-level Payload/ folder.
      - name: Package as IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/OpenLink.app
          test -d "$APP" || { echo "No .app at $APP"; ls -R build/Build/Products; exit 1; }
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          mkdir -p ../dist
          zip -qry "../dist/OpenLink-parent-${{ needs.version.outputs.name }}-unsigned.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: dist/*.ipa
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          cat > notes.md <<'EOF'
          OpenLink is a serverless, peer-to-peer alternative to Google Family Link.
          The Android app is the managed child device; the iOS app is the parent's
          remote control. They talk directly to each other — there is no server.

          ## Downloads

          | File | Install on |
          |---|---|
          | `OpenLink-child-*.apk` | The kid's **Android** phone |
          | `OpenLink-parent-*-unsigned.ipa` | The parent's **iPhone** |

          ### Android

          Transfer the APK to the phone and open it, allowing installation from
          unknown sources, or `adb install OpenLink-child-*.apk`.

          **No device-administrator privilege is requested.** OpenLink never asks
          to become a Device Admin, so there is no alarming system grant and the
          app uninstalls like any other. That is also why there is no remote-lock
          feature: `lockNow()` requires that privilege and it isn't worth the
          cost. It doesn't ask for "display over other apps" either — the
          accessibility binding grants the blocking overlay implicitly. Time
          limits, hard blocks and downtime all work without any of it.

          This is a **debug build**, signed with Gradle's automatically generated
          debug key. It installs fine, but it is not a production release build:
          the debug key is not yours, so a future properly-signed build will not
          install over it, and it carries debug flags. For a real deployment,
          generate your own keystore and sign a release build with it.

          ### iOS

          The IPA is **unsigned**, because building an installable one requires an
          Apple Developer account and provisioning profile that CI does not have.
          Install it by sideloading, which re-signs it with your own Apple ID:

          - [AltStore](https://altstore.io/) or [Sideloadly](https://sideloadly.io/)
            — works with a free Apple ID; the app expires every 7 days and needs
            refreshing. A paid Apple Developer account extends this to a year.
          - [TrollStore](https://github.com/opa334/TrollStore) — permanent, but
            only on the iOS versions it supports.

          You can also just open `ios/` in Xcode and run it onto your own device.

          ## Status — please read

          **What is verified:** every push boots an Android emulator on two API
          levels and runs the **whole pairing handshake** against the real
          listener, with a client built the way the iPhone's is — trusting
          nothing but a certificate matching the published fingerprint. It
          asserts TLS actually completes, that the certificate served is the
          one the QR advertises, that a valid proof returns a token, that a
          wrong proof is refused, and that a client pinning the wrong
          certificate cannot connect at all. The iOS app is compile-checked
          against the current SDK, and its pairing-QR parser and connection
          diagnostics are unit-tested on a simulator against the exact strings
          the Android app produces.

          **What is not:** the iPhone's own client has never completed a
          handshake against a real device in an automated test — the Android
          half is now covered end to end, the pairing of the two halves is
          not. The blocking overlay and downtime schedules have no coverage
          either. Expect bugs there.

          That handshake test exists because of what it found the first time it
          ran, which is the headline fix in v0.4.0: **the child device had
          never completed a TLS handshake with anything, on any network.** Its
          identity key was generated authorising SHA-256/384/512 but not
          `DIGEST_NONE`, and Android's TLS stack hashes the handshake itself
          and then asks the key to sign those bytes raw — so the keystore
          refused, every single time, and the peer saw only a closed
          connection. Five separate bugs have now shipped in builds where every
          check was green: a crash on Android 10–13, an HTTP engine that cannot
          do TLS, a TLS setup that could never load the device's key, a pairing
          QR that every IPv6-capable iPhone refused to read, and this. None
          were visible to a compiler, and none to a check that only proved the
          listener bound a port.

          **New in v0.5.0 — downtime allow-lists.** Each downtime window now
          carries its own list of apps it lets through, so "22:00–07:00, but
          the phone and messages still work" is expressible. Set it per window
          from the iPhone: tap a window, then **Always allowed**. Two rules
          worth knowing, both enforced and tested: where windows overlap an
          app must be exempt from *every* active one to get through (the
          stricter window wins), and an exemption is from downtime only — a
          hard-blocked app stays blocked, and an exempt app still spends its
          daily limit.

          **Upgrading:** nothing to do. Existing downtime windows keep
          blocking everything, which is what they already did, and the
          database upgrade that adds the field is a real migration — every
          limit, schedule and usage tally is carried across, and an emulator
          test does that upgrade on a database with real rows in it on every
          push. Separately, a device still holding a TLS key from before
          v0.4.0 replaces it automatically on next launch; its certificate
          fingerprint changes with it, so show a fresh QR rather than reusing
          an old one.

          See [`docs/PROTOCOL.md`](docs/PROTOCOL.md) for the protocol and security
          model, and the per-app READMEs for known gaps.
          EOF

          TAG="${{ needs.version.outputs.name }}"
          REPO="${{ github.repository }}"

          # Re-runnable: creating an existing release fails, so fall back to
          # updating it in place. Lets a release be corrected (notes, rebuilt
          # assets) without deleting and recreating the tag.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating it."
            gh release edit "$TAG" --repo "$REPO" \
              --title "OpenLink $TAG" \
              --notes-file notes.md
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*
          else
            gh release create "$TAG" --repo "$REPO" \
              --title "OpenLink $TAG" \
              --notes-file notes.md \
              --target "${{ github.sha }}" \
              $([ "${{ needs.version.outputs.prerelease }}" = "true" ] && echo "--prerelease") \
              dist/*
          fi
