# Builds both apps on every push.
#
# This exists because neither app can be built in most development sandboxes:
# the Android SDK and the Android Gradle Plugin are only distributed from
# dl.google.com, and iOS builds require Xcode, which is macOS-only. GitHub's
# runners have both, so CI is the first place this code actually meets a
# compiler.
#
# The Android job produces an installable debug APK as a downloadable
# artifact. The iOS job compiles for the simulator, which needs no signing —
# a distributable IPA additionally requires an Apple Developer Program
# membership and a provisioning profile (see ios/README.md).

name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The ubuntu runner already ships an Android SDK with ANDROID_HOME set,
      # so there's nothing to install. android-actions/setup-android is
      # deliberately not used: it tries to install the long-obsolete `tools`
      # package, which no longer exists in the repository, and fails.
      # Licenses still need accepting so AGP may fetch any missing component.
      - name: Accept Android SDK licences
        run: |
          # The cmdline-tools directory is versioned (e.g. `latest`, `16.0`),
          # and which one the image ships changes over time — find it rather
          # than hardcoding.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # JVM unit tests run here rather than in the emulator job: they take
      # seconds, and the pairing-URI grammar checks they cover would otherwise
      # only fail on a physical iPhone, as a scan that mysteriously refuses.
      - name: Run unit tests
        working-directory: android
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openlink-child-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Compiling proved nothing about whether the app runs. A crash in the
  # foreground service's onCreate shipped in v0.2.0 with every check green,
  # because every check only ever built the code. This job boots a real
  # emulator and starts the app on it.
  #
  # The API matrix is deliberate: 30 sits inside the 29..33 range where the
  # shipped bug reproduced, and 34 is the modern path where it did not. A
  # single-API job would have been as blind as the compiler was.
  android-emulator:
    name: Android smoke test (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Without this the emulator falls back to software rendering and is slow
      # enough to time out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Must stay a single line: this action pipes `script:` to `sh -c` one
          # line at a time, so any multi-line construct is split across shells
          # and fails to parse. The script file does the work and the logcat dump.
          script: bash ./.github/scripts/run-instrumented-tests.sh

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report-api${{ matrix.api-level }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  ios:
    name: iOS (compile check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # Simulator builds need no code signing, so this verifies the Swift
      # actually compiles without requiring any Apple account or certificate.
      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild build \
            -project OpenLink.xcodeproj \
            -scheme OpenLink \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # The pairing QR is parsed here and written on Android, so a format
      # mistake is invisible to both compilers and shows up only as a scan
      # that refuses on a real iPhone. That shipped once; these tests read the
      # same fixtures the Kotlin test writes.
      #
      # The simulator is looked up rather than named: hardcoding "iPhone 16"
      # breaks the moment the runner image's Xcode moves on.
      - name: Run unit tests
        working-directory: ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS")))
            | sort_by(.key) | reverse | .[0].value
            | map(select(.isAvailable and (.name | startswith("iPhone"))))
            | .[0].udid')
          if [ -z "$DEVICE" ] || [ "$DEVICE" = "null" ]; then
            echo "No available iPhone simulator on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $DEVICE"
          xcodebuild test \
            -project OpenLink.xcodeproj \
            -scheme OpenLink \
            -configuration Debug \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
