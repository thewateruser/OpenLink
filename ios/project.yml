name: OpenLink
options:
  bundleIdPrefix: org.openlink
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

configs:
  Debug: debug
  Release: release

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.0

targets:
  OpenLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: OpenLink/Sources
    resources:
      - path: OpenLink/Assets.xcassets
    dependencies:
      - package: SocketIO
        product: SocketIO
    entitlements:
      path: OpenLink/OpenLink.entitlements
      properties:
        aps-environment: development
    info:
      path: OpenLink/Info.plist
      properties:
        CFBundleDisplayName: OpenLink
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [armv7]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        # This app talks to a self-hosted server whose address the parent
        # types in (see Auth/AuthView.swift + Auth/SettingsView.swift) — it
        # may be on a home LAN without a trusted TLS certificate. Arbitrary
        # loads are allowed so http:// / self-signed https:// self-hosted
        # servers work out of the box; tighten this if your deployment
        # always terminates TLS properly.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Only relevant if a future revision resolves the server via
        # Bonjour/mDNS on the home LAN instead of a typed-in URL; harmless
        # to declare up front since self-hosting implies a LAN server is
        # the common case.
        NSLocalNetworkUsageDescription: "OpenLink may need to reach your self-hosted OpenLink server on your local network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlink.parent
        PRODUCT_NAME: OpenLink
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true

schemes:
  OpenLink:
    build:
      targets:
        OpenLink: all
    run:
      config: Debug
    archive:
      config: Release
    test:
      config: Debug
