org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# KSP 2.x defaults to the KSP2 implementation, which Room 2.6.1's compiler
# does not support -- it crashes with "unexpected jvm signature V" while
# processing the DAOs. KSP1 handles it fine. The alternative is Room 2.7.x,
# which is KSP2-ready but pulls in androidx libraries requiring compileSdk 35;
# that bump is worth making deliberately rather than as a side effect of an
# annotation-processor workaround.
ksp.useKSP2=false
